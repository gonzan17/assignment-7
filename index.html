<!doctype html>
<html>	
<head>	
<meta charset="utf-8">
<title>portfolio</title>
	
	<style>
		
		body {
			background-color: #FFC9E4;
			height: auto;
			
		} #square {
			width: 768px;
			height: 768px;
			background-color: white;
			margin: 24px auto;
			border-radius: 48px;
			border: 24px solid #8154B9;
			display: flex;
			flex-wrap: wrap;
			justify-content: space-around;
			align-items: flex-start;
			align-content: center;
		} .thumb {
			width: 150px;
		}
		.thumb:hover{
			transform: scale(1.05);
			filter: brightness(1.15);
		} figure {
			width: 150px;
			margin: 15px;
		} figcaption {
			font: 13pt/1.4em Impact, Haettenschweiler, "Franklin Gothic Bold", "Arial Black", "sans-serif";
			text-align: center;
		}
		
		h1 {
    text-align: center;
    font-size: 55px;
    font-style: oblique;
    color: #6D49AA;
}
		h2 {
    text-align: center;
    font-size: 55px;
    font-style: oblique;
    color: white;
}
		form {
			width: 600px;
			min-height: 600px;
			padding: 24px;
			background: #8851BF;
			margin: 1px solid #330033;
			box-shadow: 2px 3px 6px #330033;
			border-radius: 18px;
			font: 14pt/1.2em Georgia;
			margin: 24px auto;
			color: white;
		} fieldset {
			margin-top: 18px;
		} #personal input, #submit {
			width: 100%;
			height: 24px;
			margin-bottom: 12px;
		} input [type="text"] {
			width:98%;
			font:12pt/1.4em Arial;
		} select {
			
			width:50%;
			font: 12pt/1.4em arial;
			padding: 2px 4px;
		} textarea {
			width: 98%;
		}input[type="submit"]{
			width: 100px;
			height: 40px;
			background: lightgreen;
			display: block;
			margin: 0 auto;
			
		}
	</style>
</head>
	

<body>
		<h1>My Portfolio</h1>
	
	<div id="square">
		

		<figure>
			<a href="Print Flyer.png" >
				<img class="thumb" src="EWBFLYER-thumb.png" >
			</a>
		<figcaption>
		Engineers Without Borders, Flyer
		</figcaption>
		</figure>
		
	
		<figure>
			<a href="N2N Poster Mockups.jpg" >
 		<img class="thumb" src="N2N-thumb.jpg" >
				</a>
		<figcaption>
		Neighbor 2 Neighbor, Posters
		</figcaption>
		</figure>
		
	
		<figure>
			<a href="Vision Boards & Boba Flyer.png" >
		<img class="thumb" src="LAVAFLYER-thumb.png" >
				</a>
		<figcaption>
		Las Vegas Association for Visual Arts, Flyer
		</figcaption>
		</figure>
		
	</div> 
	
		<form action="#" method="post">
			<h2> Contact us </h2>
				<input type="text" /><br/>
				<label> First Name</label> <br/><br/> 
				<input type="text" /><br/>
				<label> Last Name </label> <br/><br/> 
				<input type="text" /><br/>
				<label> Email </label> <br/> <br/> 
			
			<fieldset>
				<legend> Operating system</legend>
			<input type="radio" name="os" /><label>Mac OS</label> <br/>
			<input type="radio" name="os" /><label>Widnows</label> <br/>
			<input type="radio" name="os" /><label>UNIX</label> <br/> 
			</fieldset>
			
			
			<fieldset>
				<legend> Services Desired</legend>
			<input type="checkbox"> <label> Design</label><br/>
			<input type="checkbox"> <label> UX/UI</label><br/>
			<input type="checkbox"> <label> Consulting</label><br/>
			</fieldset> <br/>
			
			<label> What is your timeframe? </label> <br/>
			<select>
			<option> ASAP </option>
			<option> This Week</option>
			<option> This Month</option>
			<option> This Year</option>
			<option> Not Sure</option>
			</select>
			<br/> <br/>
			
			<label> Comments </label> <br/>
			<textarea>
			</textarea> <br/> <br/>
			<input type="Submit" value="Submit" />
		</form>
	
</body>
</html>
